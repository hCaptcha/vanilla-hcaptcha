packages:
- packages/**
- examples/**
saveExact: true
# Security fixes for versions pinned by upstream build and example tooling.
overrides:
  compression@<1.8.2: 1.8.2
  minimatch@<3.1.4: 3.1.5
  postcss@<8.5.23: 8.5.23
  # filesize uses pacote.extract; use the maintained release to avoid vulnerable tar/sigstore.
  rollup-plugin-filesize>pacote: 21.5.1
  uuid@<11.1.1: 11.1.1
  webpack-dev-middleware@<7.4.5: 7.4.6
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nice-napi: true
